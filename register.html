<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Train Ticket Booking System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page-bg" style="padding: 2rem 1rem; align-items: flex-start;">

    <div class="auth-card" style="max-width: 580px; margin: 2rem auto;">
        <div class="auth-brand">
            <div style="font-size:2rem; margin-bottom:0.5rem;">🚂</div>
            <h1>Create Account</h1>
            <p>Register for Train Ticket Booking</p>
        </div>

        <div class="auth-divider"></div>

        <form id="registerForm">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0 1rem;">
                <div class="form-group" style="grid-column: 1 / -1;">
                    <label class="form-label" for="username">Username *</label>
                    <input 
                        type="text" 
                        id="username" 
                        class="form-input" 
                        placeholder="Min 6 letters, no numbers or special characters"
                        required
                    >
                    <div class="error-message"></div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="firstName">First Name *</label>
                    <input type="text" id="firstName" class="form-input" placeholder="First name" required>
                    <div class="error-message"></div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="lastName">Last Name *</label>
                    <input type="text" id="lastName" class="form-input" placeholder="Last name" required>
                    <div class="error-message"></div>
                </div>

                <div class="form-group" style="grid-column: 1 / -1;">
                    <label class="form-label" for="email">Email Address *</label>
                    <input type="email" id="email" class="form-input" placeholder="Must contain @ and domain" required>
                    <div class="error-message"></div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="mobile">Mobile Number *</label>
                    <input type="tel" id="mobile" class="form-input" placeholder="10 digits, starts with 6/7/8/9" maxlength="10" required>
                    <div class="error-message"></div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="aadhar">Aadhar Number *</label>
                    <input type="text" id="aadhar" class="form-input" placeholder="12 digits" maxlength="12" required>
                    <div class="error-message"></div>
                </div>

                <div class="form-group" style="grid-column: 1 / -1;">
                    <label class="form-label" for="address">Address *</label>
                    <textarea id="address" class="form-input" placeholder="Enter your full address" rows="3" required></textarea>
                    <div class="error-message"></div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password *</label>
                    <input type="password" id="password" class="form-input" placeholder="Min 8 chars, uppercase, number, special" required>
                    <div class="error-message"></div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirmPassword">Confirm Password *</label>
                    <input type="password" id="confirmPassword" class="form-input" placeholder="Re-enter your password" required>
                    <div class="error-message"></div>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Create Account</button>
        </form>

        <div class="auth-footer-text mt-2">
            <p>Already have an account? <a href="login.html">Sign in here</a></p>
        </div>
    </div>

    <script src="utils.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const email = document.getElementById('email').value.trim();
            const mobile = document.getElementById('mobile').value.trim();
            const aadhar = document.getElementById('aadhar').value.trim();
            const address = document.getElementById('address').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            try {
                document.querySelectorAll('.form-input').forEach(input => clearError(input));

                Validation.validateUsername(username);
                Validation.validateNotEmpty(firstName, 'First Name');
                Validation.validateNotEmpty(lastName, 'Last Name');
                Validation.validateEmail(email);
                Validation.validateMobile(mobile);
                Validation.validateAadhar(aadhar);
                Validation.validateNotEmpty(address, 'Address');
                Validation.validatePassword(password);
                Validation.validatePasswordMatch(password, confirmPassword);

                const userData = { username, firstName, lastName, email, mobile, aadhar, address, password };
                const newUser = UserManager.register(userData);

                showAlert('Registration successful! Redirecting to login...', 'success');
                setTimeout(() => { window.location.href = 'login.html'; }, 2000);

            } catch (error) {
                showAlert(error.message, 'error');

                if (error.message.includes('email')) showError(document.getElementById('email'), error.message);
                else if (error.message.includes('mobile')) showError(document.getElementById('mobile'), error.message);
                else if (error.message.includes('username')) showError(document.getElementById('username'), error.message);
                else if (error.message.includes('password')) showError(document.getElementById('password'), error.message);
                else if (error.message.includes('Aadhar')) showError(document.getElementById('aadhar'), error.message);
            }
        });

        document.querySelectorAll('.form-input').forEach(input => {
            input.addEventListener('input', function() { clearError(this); });
        });

        document.getElementById('mobile').addEventListener('input', function() {
            this.value = this.value.replace(/\D/g, '');
        });

        document.getElementById('aadhar').addEventListener('input', function() {
            this.value = this.value.replace(/\D/g, '');
        });

        function showAlert(message, type = 'success') {
            const existing = document.querySelector('.alert');
            if (existing) existing.remove();

            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.textContent = message;
            alertDiv.style.marginBottom = '1rem';

            const form = document.getElementById('registerForm');
            form.parentNode.insertBefore(alertDiv, form);
            setTimeout(() => alertDiv.remove(), 5000);
        }
    </script>
</body>
</html>
