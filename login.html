<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Train Ticket Booking System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page-bg">

    <div class="auth-card">
        <div class="auth-brand">
            <div style="font-size:2.2rem; margin-bottom:0.5rem;">🚂</div>
            <h1>Indian Rail Booking</h1>
            <p>Sign in to your account to continue</p>
        </div>

        <div class="auth-divider"></div>

        <form id="loginForm">
            <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <input 
                    type="email" 
                    id="email" 
                    class="form-input" 
                    placeholder="you@example.com"
                    required
                >
                <div class="error-message"></div>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    class="form-input" 
                    placeholder="Enter your password"
                    required
                >
                <div class="error-message"></div>
            </div>

            <div class="form-group">
                <label class="checkbox-row">
                    <input type="checkbox" id="isAdmin">
                    <span>Login as Administrator</span>
                </label>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Sign In</button>
        </form>

        <div class="auth-footer-text mt-2">
            <p>Don't have an account? <a href="register.html">Create one here</a></p>
        </div>
    </div>

    <script src="utils.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const isAdmin = document.getElementById('isAdmin').checked;

            try {
                document.querySelectorAll('.form-input').forEach(input => clearError(input));

                Validation.validateEmail(email);
                Validation.validateNotEmpty(password, 'Password');

                if (isAdmin) {
                    UserManager.adminLogin(email, password);
                    window.location.href = 'admin-dashboard.html';
                } else {
                    UserManager.login(email, password);
                    window.location.href = 'customer-dashboard.html';
                }

            } catch (error) {
                showAlert(error.message, 'error');
            }
        });

        document.querySelectorAll('.form-input').forEach(input => {
            input.addEventListener('input', function() {
                clearError(this);
            });
        });

        document.addEventListener('DOMContentLoaded', () => {
            const currentUser = UserManager.getCurrentUser();
            if (currentUser) {
                if (currentUser.isAdmin) {
                    window.location.href = 'admin-dashboard.html';
                } else {
                    window.location.href = 'customer-dashboard.html';
                }
            }
        });

        function showAlert(message, type = 'success') {
            const existing = document.querySelector('.alert');
            if (existing) existing.remove();

            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.textContent = message;
            alertDiv.style.marginBottom = '1rem';

            const form = document.getElementById('loginForm');
            form.parentNode.insertBefore(alertDiv, form);
            setTimeout(() => alertDiv.remove(), 5000);
        }
    </script>
</body>
</html>
